<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DENBROWN AI PHOTO STUDIO</title><style>
*{box-sizing:border-box}body{margin:0;background:#efefef;color:#171717;font-family:Arial,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:white;border-bottom:1px solid #e6e6e6}header strong{font-size:20px;letter-spacing:.07em}header small{display:block;color:#777;margin-top:5px;font-size:11px;letter-spacing:.17em}.round{border-radius:100px;background:#f5f5f5;padding:11px 14px}.shell{max-width:1500px;margin:auto;padding:20px;display:grid;grid-template-columns:245px minmax(0,1fr) 275px;gap:16px}.card{background:#fff;border-radius:20px;padding:20px;min-width:0}.side{display:flex;flex-direction:column;gap:16px}.topnav{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.navbtn{background:#fff;border-radius:18px;padding:18px 8px;font-size:14px;font-weight:600;display:grid;gap:8px;place-items:center}.navbtn.active{background:#191919;color:white}.navbtn span{font-size:25px}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}h2{font-size:19px;margin:0}h3{font-size:15px;margin:0 0 13px}.muted{color:#777;font-size:13px}.stage{background:#f2f0ed;border-radius:14px;padding:12px;position:relative}.stage canvas{display:block;width:100%;max-height:65vh;object-fit:contain;touch-action:none;cursor:grab}.under{display:flex;align-items:center;justify-content:space-between;margin-top:13px;gap:10px}.iconbtn{background:transparent;font-size:23px;padding:4px 7px}.layouts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.layoutitem{background:transparent;text-align:left;padding:0;min-width:0}.layoutitem img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;border:2px solid transparent;background:#eee}.layoutitem.active img{border-color:#171717}.layoutitem span{display:block;padding-top:6px;color:#555;font-size:13px}.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.tool{background:transparent;display:grid;justify-items:center;gap:7px;color:#555;font-size:12px;padding:8px 0}.tool span{font-size:25px;color:#111}.primary{background:#191919;color:white;border-radius:100px;padding:16px;width:100%;font-weight:600;margin-top:15px}.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:48vh;overflow:auto}.thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;cursor:pointer}.outline{background:#f3f3f3;border-radius:11px;padding:12px;width:100%;margin:6px 0}.field{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:5px 0 13px;background:#fff}.mini{font-size:12px;color:#666}.stack{display:grid;gap:8px}.chiprow{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.chip{background:#eee;padding:9px 12px;border-radius:25px;white-space:nowrap;font-size:12px}.chip.active{background:#171717;color:white}.hidden{display:none!important}.mobilebottom{display:none}.status{font-size:12px;color:#666;margin-top:10px}.photoempty{padding:30px 8px;text-align:center;color:#777;font-size:13px}.editor{display:grid;gap:16px}.mobiletools{display:none}@media(max-width:1100px){.shell{grid-template-columns:200px minmax(0,1fr)}.right{grid-column:1/-1}.right .card{max-width:none}}@media(max-width:720px){header{padding:13px 16px}header strong{font-size:16px}.shell{display:flex;flex-direction:column;padding:12px;gap:13px}.left{order:2}.editor{order:1}.right{order:3}.card{padding:16px;border-radius:18px}.topnav{gap:8px;margin-bottom:12px}.navbtn{padding:12px 3px;font-size:12px}.navbtn span{font-size:21px}.stage{padding:9px}.layouts{gap:8px}h2{font-size:18px}.mobiletools{display:block}.thumbs{grid-template-columns:repeat(4,1fr);max-height:230px}.desktoptools{display:none}.mobilebottom{display:block;position:sticky;bottom:0;background:#efefef;padding:10px 0 4px;z-index:4}.mobilebottom .primary{margin:0}.shell{padding-bottom:10px}} </style></head><body>
<header><div><strong>DENBROWN <span style="font-weight:400">AI PHOTO</span></strong><small>WEDDING DESIGN STUDIO</small></div><button class="round" id="menuBtn">☰</button></header>
<div class="shell">
<aside class="side left"><div class="card"><div class="heading"><h2>Thư viện ảnh</h2><span class="muted" id="count">0 ảnh</span></div><button class="outline" id="addPhotos">＋ Thêm ảnh từ thiết bị</button><input type="file" id="fileInput" accept="image/*" multiple hidden><div class="thumbs" id="thumbs"><div class="photoempty">Chọn ảnh cưới để bắt đầu thiết kế.</div></div><p class="mini">Chạm ảnh để thay vào ô đang chọn. Ảnh chỉ xử lý trên thiết bị.</p></div></aside>
<main class="editor"><div><div class="topnav"><button class="navbtn" id="photosNav"><span>▧</span>Thư viện ảnh</button><button class="navbtn active" id="layoutsNav"><span>▤</span>Mẫu album</button><button class="navbtn" id="designNav"><span>✎</span>Thiết kế</button></div>
<div class="card"><div class="heading"><h2>Không gian chỉnh sửa</h2><button class="iconbtn" id="settings" title="Tùy chỉnh">☷</button></div><div class="stage"><canvas id="canvas" width="1200" height="900"></canvas></div><div class="under"><span class="muted" id="pageText">Trang 01 / 01</span><div><button class="iconbtn" id="undo" title="Hoàn tác">↶</button><button class="iconbtn" id="zoom" title="Đổi kích thước xem">⊕</button><button class="iconbtn" id="download" title="Xuất JPG">⇩</button></div></div></div></div>
<div class="card" id="library"><div class="heading"><h2>Thư viện layout cưới</h2><span class="muted" id="layoutCount"></span></div><div class="chiprow" id="filters"></div><div class="layouts" id="layoutGrid"></div></div>
<div class="card mobiletools"><h2 style="margin-bottom:15px">Công cụ chỉnh sửa</h2><div class="tools" id="toolsMobile"></div></div>
<div class="mobilebottom"><button class="primary" id="applyMobile">✧ Áp dụng thiết kế này</button></div></main>
<aside class="side right"><div class="card desktoptools"><h2 style="margin-bottom:15px">Công cụ chỉnh sửa</h2><div class="tools" id="toolsDesktop"></div></div><div class="card" id="options"><h3>Thiết lập thiết kế</h3><label class="mini">Màu nền</label><input class="field" type="color" id="bg" value="#ffffff"><label class="mini">Chữ trên album</label><input class="field" id="caption" placeholder="Love Story / Tên cô dâu chú rể"><label class="mini">Kích thước xuất</label><select class="field" id="resolution"><option value="1200">1200 px</option><option value="2400">2400 px</option><option value="4000">4000 px</option></select><div class="stack"><button class="outline" id="prev">← Trang trước</button><button class="outline" id="next">Trang tiếp →</button><button class="outline" id="newPage">＋ Thêm trang</button><button class="outline" id="save">Lưu dự án trên máy</button><button class="outline" id="restore">Mở dự án đã lưu</button></div><button class="primary" id="apply">✧ Áp dụng thiết kế này</button><p class="status" id="status">Sẵn sàng thiết kế.</p></div></aside></div>
<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');let photos=[],templates=[],selected=0,page=0,pages=[{template:0,assign:[],bg:'#ffffff',text:''}],history=[],drag=null,filter='Tất cả',zoomed=false;
const setStatus=s=>$('status').textContent=s;const current=()=>pages[page];const fallback=[{id:'e',name:'Editorial',category:'Editorial',aspect_ratio:'4:3',slots:[{x:.04,y:.06,w:.46,h:.88},{x:.53,y:.06,w:.43,h:.42},{x:.53,y:.51,w:.43,h:.43}]},{id:'g',name:'Grid',category:'Grid',aspect_ratio:'1:1',slots:Array.from({length:9},(_,i)=>({x:.05+(i%3)*.305,y:.05+Math.floor(i/3)*.305,w:.29,h:.29}))},{id:'f',name:'Fine Art',category:'Fine Art',aspect_ratio:'4:3',slots:[{x:.1,y:.12,w:.38,h:.76},{x:.55,y:.12,w:.35,h:.35},{x:.55,y:.52,w:.35,h:.36}]}];
function snap(){history.push(JSON.stringify(pages));if(history.length>30)history.shift()}
function chooseTemplate(i){snap();current().template=i;current().assign=[];selected=0;draw();renderTemplates();setStatus('Đã chọn '+templates[i].name)}
function slots(){return templates[current().template]?.slots||fallback[0].slots}
function aspect(){let s=templates[current().template]?.aspect_ratio||'4:3';let [a,b]=s.split(':').map(Number);return a/b||4/3}
function imageCover(img,x,y,w,h,offX=0,offY=0,scale=1){let k=Math.max(w/img.width,h/img.height)*scale,sw=w/k,sh=h/k,sx=(img.width-sw)/2-offX*sw,sy=(img.height-sh)/2-offY*sh;ctx.drawImage(img,Math.max(0,Math.min(img.width-sw,sx)),Math.max(0,Math.min(img.height-sh,sy)),Math.min(sw,img.width),Math.min(sh,img.height),x,y,w,h)}
function draw(){let ratio=aspect();canvas.width=1200;canvas.height=Math.round(1200/ratio);let w=canvas.width,h=canvas.height,p=current();ctx.fillStyle=p.bg;ctx.fillRect(0,0,w,h);slots().forEach((s,i)=>{let x=s.x*w,y=s.y*h,sw=s.w*w,sh=s.h*h;ctx.save();ctx.beginPath();ctx.rect(x,y,sw,sh);ctx.clip();let photo=photos[p.assign[i]??i];if(photo?.img){imageCover(photo.img,x,y,sw,sh,photo.dx||0,photo.dy||0,photo.scale||1)}else{ctx.fillStyle='#e7e2dd';ctx.fillRect(x,y,sw,sh);ctx.fillStyle='#aaa';ctx.font='28px Arial';ctx.textAlign='center';ctx.fillText('＋ Ảnh '+(i+1),x+sw/2,y+sh/2)}ctx.restore();if(selected===i){ctx.strokeStyle='#262626';ctx.lineWidth=5;ctx.strokeRect(x,y,sw,sh)}});if(p.text){ctx.fillStyle='#222';ctx.font='italic 46px Georgia';ctx.textAlign='center';ctx.fillText(p.text,w/2,h-24,w*.9)}$('pageText').textContent=`Trang ${String(page+1).padStart(2,'0')} / ${String(pages.length).padStart(2,'0')}`;$('bg').value=p.bg;$('caption').value=p.text}
function renderTemplates(){let arr=templates.map((t,i)=>({...t,i})).filter(t=>filter==='Tất cả'||t.category===filter);$('layoutGrid').innerHTML='';arr.forEach(t=>{let b=document.createElement('button');b.className='layoutitem'+(current().template===t.i?' active':'');let im=document.createElement('img');im.src=t.reference||'references/IMG_1393.jpeg';im.loading='lazy';im.onerror=()=>{im.src='references/IMG_1393.jpeg'};let label=document.createElement('span');label.textContent=t.name;b.append(im,label);b.onclick=()=>chooseTemplate(t.i);$('layoutGrid').append(b)});$('layoutCount').textContent=templates.length+' mẫu'}
function renderFilters(){let cats=['Tất cả',...new Set(templates.map(t=>t.category))];$('filters').innerHTML='';cats.forEach(c=>{let b=document.createElement('button');b.className='chip'+(filter===c?' active':'');b.textContent=c;b.onclick=()=>{filter=c;renderFilters();renderTemplates()};$('filters').append(b)})}
function renderPhotos(){$('count').textContent=photos.length+' ảnh';$('thumbs').innerHTML='';photos.forEach((p,i)=>{let im=document.createElement('img');im.className='thumb';im.src=p.src;im.title='Chọn ảnh '+(i+1);im.onclick=()=>{snap();current().assign[selected]=i;draw();setStatus('Đã thay ảnh vào ô '+(selected+1))};$('thumbs').append(im)});if(!photos.length)$('thumbs').innerHTML='<div class="photoempty">Chọn ảnh cưới để bắt đầu thiết kế.</div>'}
$('addPhotos').onclick=()=>$('fileInput').click();$('photosNav').onclick=()=>$('fileInput').click();$('layoutsNav').onclick=()=>$('library').scrollIntoView({behavior:'smooth'});$('designNav').onclick=()=>$('options').scrollIntoView({behavior:'smooth'});$('menuBtn').onclick=()=>$('options').scrollIntoView({behavior:'smooth'});$('settings').onclick=()=>$('options').scrollIntoView({behavior:'smooth'});
$('fileInput').onchange=async e=>{let files=[...e.target.files].filter(f=>f.type.startsWith('image/'));for(let file of files){let src=await new Promise(r=>{let rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(file)});let img=await new Promise(r=>{let i=new Image();i.onload=()=>r(i);i.src=src});photos.push({src,img,name:file.name,dx:0,dy:0,scale:1})}renderPhotos();draw();setStatus('Đã nhập '+files.length+' ảnh');e.target.value=''};
function pointerPos(e){let rect=canvas.getBoundingClientRect();return {x:(e.clientX-rect.left)/rect.width,y:(e.clientY-rect.top)/rect.height}}
canvas.addEventListener('pointerdown',e=>{let p=pointerPos(e),ss=slots();let hit=ss.findIndex(s=>p.x>=s.x&&p.x<=s.x+s.w&&p.y>=s.y&&p.y<=s.y+s.h);if(hit>=0){selected=hit;drag=p;canvas.setPointerCapture(e.pointerId);snap();draw()}});canvas.addEventListener('pointermove',e=>{if(!drag)return;let p=pointerPos(e),idx=current().assign[selected]??selected,ph=photos[idx];if(ph){ph.dx=Math.max(-.5,Math.min(.5,(ph.dx||0)+(p.x-drag.x)));ph.dy=Math.max(-.5,Math.min(.5,(ph.dy||0)+(p.y-drag.y)));draw()}drag=p});canvas.addEventListener('pointerup',()=>drag=null);
const tools=[['✥','Di chuyển',()=>setStatus('Kéo ảnh trong khung để điều chỉnh vị trí')],['⊞','Cắt ảnh',()=>{let ph=photos[current().assign[selected]??selected];if(ph){ph.scale=(ph.scale||1)*1.15;draw();setStatus('Đã phóng ảnh trong khung')}}],['▱','Lớp ảnh',()=>{let i=current().assign[selected]??selected;if(photos.length){snap();current().assign[selected]=(i+1)%photos.length;draw()}}],['◉','Màu nền',()=>$('bg').click()],['T','Chữ',()=>$('caption').focus()]];for(let target of ['toolsDesktop','toolsMobile'])tools.forEach(([ic,label,fn])=>{let b=document.createElement('button');b.className='tool';b.innerHTML='<span>'+ic+'</span>'+label;b.onclick=fn;$(target).append(b)});
$('bg').oninput=e=>{current().bg=e.target.value;draw()};$('caption').oninput=e=>{current().text=e.target.value;draw()};$('undo').onclick=()=>{if(history.length){pages=JSON.parse(history.pop());page=Math.min(page,pages.length-1);draw();renderTemplates()}};$('zoom').onclick=()=>{zoomed=!zoomed;canvas.style.maxHeight=zoomed?'none':'65vh'};$('newPage').onclick=()=>{snap();pages.push({template:current().template,assign:[],bg:'#ffffff',text:''});page=pages.length-1;draw()};$('prev').onclick=()=>{page=Math.max(0,page-1);draw();renderTemplates()};$('next').onclick=()=>{page=Math.min(pages.length-1,page+1);draw();renderTemplates()};
function exportJpg(){let old=canvas.width,sz=Number($('resolution').value);let c=document.createElement('canvas');c.width=sz;c.height=Math.round(sz/aspect());c.getContext('2d').drawImage(canvas,0,0,c.width,c.height);let a=document.createElement('a');a.href=c.toDataURL('image/jpeg',.94);a.download=`DENBROWN_Trang_${page+1}.jpg`;a.click();setStatus('Đã tạo file JPG để tải xuống')}$('download').onclick=exportJpg;$('apply').onclick=exportJpg;$('applyMobile').onclick=exportJpg;
$('save').onclick=()=>{try{localStorage.setItem('denbrown-studio-project',JSON.stringify({pages,images:photos.map(p=>({src:p.src,name:p.name,dx:p.dx,dy:p.dy,scale:p.scale}))}));setStatus('Đã lưu dự án trên trình duyệt này')}catch(e){setStatus('Dung lượng lưu trữ không đủ. Hãy xuất JPG trước.')}};
$('restore').onclick=async()=>{let data=localStorage.getItem('denbrown-studio-project');if(!data){setStatus('Chưa có dự án được lưu');return}let d=JSON.parse(data);pages=d.pages;photos=await Promise.all(d.images.map(async p=>({...p,img:await new Promise(r=>{let i=new Image();i.onload=()=>r(i);i.src=p.src})})));page=0;renderPhotos();draw();renderTemplates();setStatus('Đã mở dự án')};
fetch('layouts.json').then(r=>r.json()).then(d=>{templates=[...fallback,...(d.templates||[])];renderFilters();renderTemplates();draw()}).catch(()=>{templates=fallback;renderFilters();renderTemplates();draw()});
</script></body></html>
